# docker compose up -d   then open http://strivo.local:8091 (or http://<this computer's IP>:8091) on your phone.
services:
  strivo:
    image: ghcr.io/nickdnj/strivo:latest
    # build: .            # uncomment to build from this checkout instead
    container_name: strivo
    network_mode: host    # required: StriVo finds and talks to your boxes on the home network
    restart: unless-stopped
    environment:
      - TZ=America/New_York   # your time zone, so history days line up
      # - STRIVO_PORT=8091
    volumes:
      - strivo-data:/data

volumes:
  strivo-data:
