<script>

let dcat=localStorage.getItem("wl_dcat")||"series",dsub=localStorage.getItem("wl_dsub")||"all";
if(tab=="shw"){tab="disc";dcat="series"}else if(tab=="sug"){tab="disc";dcat="movies"}

let AC=null;
function tone(f0,f1,dur,vol,delay){return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
 o.type="sine";o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+0.02)}catch(e){}}
const bloop=()=>tone(260,420,.11,.25);        // move / select
const dong=()=>{tone(520,520,.16,.22);tone(780,780,.22,.2,.09)}; // open / back
function setTheme(n){localStorage.setItem("wl_theme",n);document.documentElement.dataset.theme=n;head()}
function head(){$("#snd").style.display="none";$("#snd").textContent=snd?"Sound on":"Sound off"}
$("#theme").style.display="none";
$("#snd").onclick=()=>{snd=!snd;localStorage.setItem("wl_snd",snd?"on":"off");head();bloop()};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mm=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+"h "+m+"m":m+"m"};
const ago=t=>{const d=(Date.now()/1e3-t);if(d<3600)return Math.max(1,Math.round(d/60))+" min ago";if(d<86400)return Math.round(d/3600)+" h ago";return new Date(t*1e3).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})};
const sdate=t=>new Date(t*1e3).toLocaleDateString(undefined,{weekday:"short"})+" "+(new Date(t*1e3).getMonth()+1)+"/"+new Date(t*1e3).getDate();
const posters={};
function fillPoster(name,url){document.querySelectorAll('[data-po="'+CSS.escape(name)+'"]').forEach(e=>e.innerHTML='<img src="'+url+'" alt="">')}
function poster(name,el,typ){if(!name)return;if(name in posters){if(posters[name])fillPoster(name,posters[name]);return}
 posters[name]="";fetch("/api/poster?q="+encodeURIComponent(name)+(typ?"&type="+typ:"")).then(r=>r.json()).then(j=>{posters[name]=j.url||"";if(j.url)fillPoster(name,j.url)}).catch(()=>{})}
const epl=e=>(e.season!=null?"S"+e.season+" ":"")+(e.ep!=null?"E"+e.ep:"")+(e.ept?(e.ep!=null?" · ":"")+e.ept:"");
function poBox(name,icon,badge,typ){return '<div class="pw"><div class="po" data-po="'+esc(name)+'" data-pt="'+(typ||(icon=="🎬"?"movie":"tv"))+'">'+(icon||"▶")+'</div>'+(badge>0?'<span class="badge">'+(badge>9?"9+":badge)+'</span>':'')+'</div>'}
const rmBtn=(kind,name)=>'<button class="x" data-rm="'+kind+'" data-name="'+esc(name)+'" title="Remove from Now Playing">✕</button>';
const side=(date,kind,name,app)=>'<div class="side"><span class="date">'+date+'</span>'+(app?'<button class="btn add" data-play="'+esc(name)+'" data-app="'+esc(app)+'" title="Play on TV">▶ Play</button>':'')+rmBtn(kind,name)+'</div>';
function rowSeries(s,i){const e=s.latest,pct=e.total?Math.min(100,Math.round(100*(e.pos||0)/e.total)):0;
 const st=e.done?'<div class="s" style="color:var(--ok)">Finished · '+s.episodes.length+' watched</div>':
   (e.total?'<div class="bar"><i style="width:'+pct+'%"></i></div><div class="s">Stopped at '+mm(e.pos||0)+' of '+mm(e.total)+' · '+s.episodes.length+' watched</div>':'<div class="s">'+s.episodes.length+' watched</div>');
 return '<div class="row" data-i="'+i+'" style="cursor:pointer">'+poBox(s.series,null,s.unwatched)+'<div class="grow"><div class="t">'+esc(s.series)+'<span class="tag">'+esc(s.app)+'</span>'+(s.new_season?'<span class="tag" style="color:var(--acc)">New season '+s.new_season+'</span>':'')+'</div><div class="s">'+(epl(e)?'Latest: '+esc(epl(e)):'Watched')+'</div>'+st+'</div>'+side(ago(s.last),"series",s.series,s.app)+'</div>'}
const norm=x=>String(x||"").toLowerCase().replace(/[^a-z0-9]/g,"");
async function openShow(s){immOff();bloop();detail=s;window.scrollTo(0,0);const rec=["game","news","late","live"].includes(s.cat);const m=$("#main");m.innerHTML='<button class="btn back" id="back">‹ Back</button><div class="empty">Loading episodes…</div>';$("#back").onclick=()=>{dong();detail=null;render()};
 let info=null;if(!rec)try{info=await (await fetch("/api/show?q="+encodeURIComponent(s.series))).json()}catch(e){}
 const used=new Set(),ok=(sn,ep,nm)=>s.episodes.find(w=>!used.has(w)&&((w.season!=null&&w.ep!=null&&w.season==sn&&w.ep==ep)||(w.ept&&norm(w.ept)==norm(nm))));
 let h='<button class="btn back" id="back">‹ Back</button><button class="btn add" style="float:right" data-shplay="'+esc(s.series)+'" data-app="'+esc(s.app)+'">▶ Play on TV</button><div class="hd">'+poBox(s.series)+'<div class="grow"><div class="t" style="font-size:19px;white-space:normal">'+esc(s.series)+'</div><div class="s">'+esc(s.app)+' · '+s.hours+' h watched · '+s.episodes.length+' episode'+(s.episodes.length==1?'':'s')+' seen</div>'+(info&&info.overview?'<div class="s" style="white-space:normal;margin-top:6px">'+esc(info.overview.slice(0,220))+'</div>':'')+'</div></div>';
 const epRow=(w,name,label)=>{const pct=w&&w.total?Math.round(100*(w.pos||0)/w.total):0,st=!w?"un":w.done?"done":"part";
  return '<div class="ep'+(st=="un"?" un":"")+'"><div class="ic">'+(st=="done"?"✓":st=="part"?"◐":"○")+'</div><div class="grow"><div class="t">'+esc(label)+(name?' · '+esc(name):'')+'</div>'+(w?(st=="part"?'<div class="bar"><i style="width:'+pct+'%"></i></div><div class="s">Stopped at '+mm(w.pos||0)+' of '+mm(w.total||0)+' · '+ago(w.last)+'</div>':'<div class="s">Watched '+ago(w.last)+'</div>'):'')+'</div></div>'};
 if(info&&info.seasons&&info.seasons.length){
  const lastW=s.episodes.slice().sort((x,y)=>y.last-x.last).find(w=>w.season!=null);
  const blocks=info.seasons.map(sn=>{const rows=sn.episodes.map(e=>{const w=ok(sn.n,e.ep,e.name);if(w)used.add(w);return {e,w}});return {n:sn.n,rows,seen:rows.filter(r=>r.w).length}});
  const cur=(lastW&&blocks.find(x=>x.n==lastW.season))||blocks.find(x=>x.seen)||blocks[0];
  h+='<div class="sortbar">Season <select id="ssel" class="btn">'+blocks.map(x=>'<option value="'+x.n+'"'+(x==cur?' selected':'')+'>Season '+x.n+' — '+x.seen+' of '+x.rows.length+' watched</option>').join("")+'</select></div><div id="sbody"></div>';
  window._blocks=blocks;window._epRow=epRow;
  const rest=s.episodes.filter(w=>!used.has(w));if(rest.length)h+='<div class="ssn">Other watched</div>'+rest.map(w=>epRow(w,w.ept,epl({season:w.season,ep:w.ep})||"Episode")).join("")
 }else h+=(rec?'<div class="s" style="margin-bottom:8px">'+(s.cat=="game"?'Game or daily show: only the latest '+D.cfg.recurring_keep+' episodes are kept.':'Short-lived show: kept for '+(s.cat=="news"?D.cfg.news_days:D.cfg.daily_days)+' days.')+'</div>':'')+s.episodes.slice().reverse().map(w=>epRow(w,(w.season!=null||w.ep!=null)?w.ept:"",epl({season:w.season,ep:w.ep})||w.ept||"Watched")).join("");
 m.innerHTML=h;$("#back").onclick=()=>{dong();detail=null;render()};
 const sel=$("#ssel");if(sel){const draw=()=>{const bl=window._blocks.find(x=>x.n==sel.value);$("#sbody").innerHTML=bl.rows.map(r=>window._epRow(r.w,r.e.name,"E"+r.e.ep)).join("")};sel.onchange=()=>{bloop();draw()};draw()}
 m.querySelectorAll("[data-po]").forEach(el=>poster(el.dataset.po,el,el.dataset.pt))}
function rmList(kind){const r=(D.removed||[]).filter(x=>x.kind==kind);if(!r.length)return"";
 return '<div class="rmlist"><button class="btn" id="rmtoggle">Removed · '+r.length+'</button><div id="rmbody" hidden>'+r.map(x=>'<div class="row"><div class="grow"><div class="t">'+esc(x.name)+'</div><div class="s">Removed '+ago(x.at)+' · comes back when you watch it again</div></div><button class="btn" data-rs="'+kind+'" data-name="'+esc(x.name)+'">Restore</button></div>').join("")+'</div></div>'}

 if(undo)d.querySelector("button").onclick=()=>{undo();d.remove()};setTimeout(()=>d.remove(),6000)}

 return c||'<div class="s" style="margin-top:8px">Not streaming in your country yet. Strivo can tell you when it lands on one of your services (Settings › Notifications).</div>'}

 const rows=[["Type",tv?"TV show":"Movie"],tv?["Premiered",fdate(w.first_air)]:["Released",fdate(w.release)],tv?["Network",(w.networks||[]).join(", ")]:["Studio",(w.studios||[]).join(", ")],
  tv?["Seasons",w.seasons?w.seasons+(w.episodes?" ("+w.episodes+" episodes)":""):""]:["Runtime",w.runtime?w.runtime+" min":""],["Status",w.status],tv?["Last aired",fdate(w.last_air)]:["",""],
  tv?["Next episode",w.next_air?((w.next_ep?w.next_ep+" · ":"")+(w.network?w.network+" · ":"")+fdate(w.next_air)):""]:["",""],
  [tv?"Created by":"Directed by",(w.makers||[]).join(", ")],["Cast",(w.cast||[]).join(", ")],["Genres",(w.genres||[]).join(", ")],["Rating",w.rating?"★ "+w.rating+" / 10":""]].filter(r=>r[1]);
 m.innerHTML='<button class="btn back" id="wback">‹ Back</button><div class="hd">'+imgBox(w.poster)+'<div class="grow"><div class="t" style="font-size:19px;white-space:normal">'+esc(w.title)+'</div><div class="s">'+(w.year?esc(w.year):"")+'</div>'+(w.tagline?'<div class="s" style="white-space:normal;font-style:italic;margin-top:4px">'+esc(w.tagline)+'</div>':'')+'</div></div>'+
  (w.overview?'<div class="row" style="display:block"><div style="white-space:normal;line-height:1.45">'+esc(w.overview)+'</div></div>':'')+

  '<div class="day">Where to watch</div><div class="row" style="display:block">'+provGroups(w)+(w.link?'<div style="margin-top:8px"><a class="lnk" target="_blank" rel="noopener" href="'+esc(w.link)+'">All options on JustWatch ›</a></div>':'')+
  (w.live?'<div style="margin-top:6px"><a class="lnk" target="_blank" rel="noopener" href="https://tv.youtube.com/search?q='+encodeURIComponent(w.title)+'">Open in YouTube TV to record ›</a></div>':'')+'</div>'+
  '<div style="margin-top:12px;display:flex;gap:8px"><button class="btn add" id="wplay">▶ Play</button><button class="btn" id="wrm">Remove from To Watch</button></div>';
 $("#wback").onclick=()=>{dong();render()};$("#wplay").onclick=()=>{bloop();tvSheet(w)};
 $("#wrm").onclick=async()=>{bloop();await fetch("/api/wish",{method:"POST",body:JSON.stringify({action:"remove",id:w.id,type:w.type})});render()}}
const imgBox=u=>'<div class="pw"><div class="po">'+(u?'<img src="'+esc(u)+'" alt="">':'▶')+'</div></div>';

async function wishLoad(){try{WL=await (await fetch("/api/wishlist")).json()}catch(e){WL=[]}drawWL()}
function drawWL(){const el=$("#wlist");if(!el)return;if(mode!="posters")immOff();
 if(mode=="posters"){reelFeed(el,WL.map(cardWL));return}
 el.innerHTML=WL.length?WL.map((w,wi)=>{const nx=w.next_air?('Next: '+(w.next_ep?esc(w.next_ep)+' · ':'')+(w.network?esc(w.network)+' · ':'')+new Date(w.next_air+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})):"";
  const grp=(label,kinds)=>{const ps=(w.providers||[]).filter(p=>kinds.includes(p.kind));return ps.length?'<div class="s" style="margin-top:5px">'+label+'</div><div>'+ps.map(p=>'<span class="chip'+(p.mine&&kinds[0]=="flatrate"?' mine':'')+'">'+esc(p.name)+'</span>').join("")+'</div>':''};
  const chips=grp("Stream (included with a subscription)",["flatrate"])+grp("Free with ads",["free","ads"])+grp("Rent",["rent"])+grp("Buy",["buy"]);
  const none=chips?'':'<div class="s" style="margin-top:5px">Not streaming in your country yet. Strivo can tell you when it lands on one of your services (Settings › Notifications).</div>';
  const more=w.link?'<a class="lnk" target="_blank" rel="noopener" href="'+esc(w.link)+'">All options on JustWatch ›</a>':'';
  const fd=d=>d?new Date(d+"T12:00:00").toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):"";

    [w.release?'Released '+fd(w.release):'',(w.studios&&w.studios.length)?w.studios.join(", "):'',w.runtime?w.runtime+' min':'',w.status||''];
  const meta=[(w.genres||[]).join(" · "),w.rating?('★ '+w.rating):''].filter(Boolean).join("  ");
  return '<div class="row" data-wi="'+wi+'" style="cursor:pointer">'+imgBox(w.poster)+'<div class="grow"><div class="t">'+esc(w.title)+'<span class="tag">'+(w.type=="tv"?"Show":"Movie")+(w.year?' · '+esc(w.year):'')+'</span></div><div class="s" style="white-space:normal">'+facts.filter(Boolean).map(esc).join(" · ")+'</div>'+(nx?'<div class="s" style="color:var(--acc);white-space:normal">'+nx+'</div>':'')+(meta?'<div class="s">'+esc(meta)+'</div>':'')+(w.overview?'<div class="s" style="white-space:normal;margin-top:3px">'+esc(w.overview.slice(0,160))+(w.overview.length>160?'… <span style="color:var(--acc)">more</span>':'')+'</div>':'')+chips+none+'<div>'+more+'</div>'+
   (w.live?'<a class="lnk" target="_blank" rel="noopener" href="https://tv.youtube.com/search?q='+encodeURIComponent(w.title)+'">Open in YouTube TV to record ›</a>':'')+'</div><div class="side"><button class="x" data-wr="'+w.id+'" data-wt="'+w.type+'" title="Remove">✕</button></div></div>'}).join(""):'<div class="empty">Nothing here yet. Search above and add a show or movie.</div>';

 const u=d.updates||{},when=u.last_check?ago(u.last_check):"never";
 el.innerHTML=(d.boxes.length?d.boxes.map(b=>'<div class="ln"><div>'+HICON[b.state]+' '+esc(b.name)+'</div><span class="s">'+esc(b.state)+'</span></div>').join(""):'<div class="s">No boxes yet.</div>')+
  d.apps.filter(a=>a.state!="healthy").map(a=>'<div class="ln"><div>'+HICON[a.state]+' '+esc(a.app)+' <span class="s">on '+esc(a.device_name)+'</span></div><span class="s">'+esc(a.state=="app-only"?"app only (a known limit)":a.state)+'</span></div>').join("")+
  d.problems.map(p=>'<div style="margin:8px 0;padding:8px 10px;border:1px solid var(--warn);border-radius:10px"><div class="t" style="white-space:normal">'+esc(p.what)+'</div><div class="s" style="white-space:normal">'+esc(p.summary)+' '+esc(p.cause||"")+'</div>'+(p.steps||[]).map(x=>'<div class="note">· '+esc(x)+'</div>').join("")+'<button class="btn" style="margin-top:6px" data-rep="'+esc(p.key)+'">Check for an existing report…</button></div>').join("")+
  '<div class="note" style="margin-top:8px">Rules '+esc(d.rules.version)+(d.rules.source=="update"?' (updated)':'')+' · last checked for fixes '+esc(when)+(u.status?' · '+esc(u.status):'')+(u.error?' · '+esc(u.error):'')+'</div>'+
  (u.code_update?'<div class="note" style="color:var(--warn)">Strivo '+esc(u.latest_version)+' is available. Update your container or package when convenient; Strivo never updates its own code.</div>':'')+
  (u.rules_available?'<button class="btn add" id="rapply" style="margin-top:6px">Install rules '+esc(u.rules_available)+'</button>':'')+
  '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn" id="hcheck">Check for fixes now</button>'+(d.rules.source=="update"?'<button class="btn" id="hroll">Undo last rules update</button>':'')+'</div>';
 $("#hcheck").onclick=()=>{el.querySelector(".note").textContent="Checking GitHub…";healthBox(true)};
 if($("#hroll"))$("#hroll").onclick=async()=>{await jpost("/api/doctor/rollback");healthBox()};
 if($("#rapply"))$("#rapply").onclick=async()=>{try{await jpost("/api/doctor/apply");toast("Installed")}catch(e){toast(e.message)}healthBox()};
 el.querySelectorAll("[data-rep]").forEach(b=>b.onclick=async()=>{const r=await (await fetch("/api/doctor/report?key="+encodeURIComponent(b.dataset.rep))).json();
  const box=document.createElement("div");box.className="tvs";box.style.cssText="position:fixed;inset:0;background:#000a;z-index:120;display:flex;align-items:flex-end;justify-content:center";
  const title=r.existing?"Existing compatibility report":"Prepare a report?";const action=r.existing?"👍 it if this is you":"Open on GitHub";
  box.innerHTML='<div style="background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:16px;width:100%;max-width:560px;box-sizing:border-box"><div class="t">'+title+'</div><div class="s" style="white-space:normal;margin:6px 0">'+(r.existing?"Someone already reported this. Open it and add a 👍 (and anything you noticed) instead of filing a new one. For comparison, your report would have said:":"It opens a GitHub issue for you to review and submit. Strivo sends nothing itself. The report contains only:")+'</div>'+Object.entries(r.fields).filter(x=>x[1]!==null&&x[1]!=="").map(([k,v])=>'<div style="display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid var(--line)"><span class="s">'+esc(k.replace(/_/g," "))+'</span><span>'+esc(v)+'</span></div>').join("")+'<a class="btn add" style="display:block;text-align:center;margin-top:10px;padding:10px;text-decoration:none" target="_blank" rel="noopener" href="'+esc(r.url)+'">'+action+'</a><button class="btn" style="width:100%;padding:10px;margin-top:8px" id="repx">Cancel</button></div>';
  document.body.appendChild(box);box.querySelector("#repx").onclick=()=>box.remove()})}
function tmdbSheet(done){const d=document.createElement("div");d.className="tvs";d.style.cssText="position:fixed;inset:0;background:#000a;z-index:120;display:flex;align-items:flex-end;justify-content:center";document.body.appendChild(d);
 d.innerHTML='<div style="background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:16px;width:100%;max-width:560px;box-sizing:border-box">'+tmdbForm()+'<button class="btn" id="tx" style="width:100%;padding:10px;margin-top:10px">Close</button></div>';
 bindTmdb(d,()=>{d.remove();done&&done()});d.querySelector("#tx").onclick=()=>d.remove()}
const tmdbForm=()=>'<div class="s" style="white-space:normal;margin-bottom:8px">Strivo gets posters, episode lists and picks from TMDB. Only show and movie titles are sent, never your history. A key is free: sign up at <a class="lnk" href="https://www.themoviedb.org/signup" target="_blank" rel="noopener">themoviedb.org</a>, then copy the <b>API Read Access Token</b> from <a class="lnk" href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">Settings › API</a>.</div><input class="wq" id="tkey" placeholder="Paste the token" autocomplete="off" autocapitalize="off"><button class="btn add" id="tsave" style="width:100%;padding:10px;margin-top:8px">Save key</button><div class="note" id="tmsg"></div>';
function bindTmdb(el,ok){el.querySelector("#tsave").onclick=async()=>{const k=el.querySelector("#tkey").value.trim();if(!k)return;el.querySelector("#tmsg").textContent="Checking…";
 try{await jpost("/api/setup/tmdb",{key:k});el.querySelector("#tmsg").textContent="✓ Key works.";await suLoad();ok&&ok()}catch(e){el.querySelector("#tmsg").textContent=e.message}}}
async function devicesPage(){const m=$("#main");m.innerHTML='<div class="set" id="devp"><div class="empty">Loading…</div></div>';await suLoad();
 const draw=async()=>{let hl=[];try{hl=(await (await fetch("/api/health")).json()).devices}catch(e){}
  const el=$("#devp");if(!el)return;el.innerHTML='<h3>Your boxes</h3>'+devRows(hl)+'<h3>Add a box or media server</h3><div id="addb"></div><div class="note" style="margin-top:14px">Tap a name to rename it. History stays when you rename or remove a box.</div>';
  bindDevRows(el,async()=>{await suLoad();draw()});addBox($("#addb"),async()=>{await suLoad();draw()})};
 draw()}
// ---- first-run wizard
const WSTEPS=["Welcome","Your boxes","Show info","Your services","Your TVs"];
function wizard(){let w=$("#wiz");if(!w){w=document.createElement("div");w.id="wiz";w.className="rd";document.body.appendChild(w)}
 const S=SU,nav=(back,next,label)=>'<div style="display:flex;gap:8px;margin-top:18px">'+(back?'<button class="btn" id="wb" style="flex:1;padding:12px">‹ Back</button>':'')+'<button class="btn add" id="wn" style="flex:2;padding:12px;background:var(--acc);color:#fff;border-color:var(--acc)">'+(label||"Next ›")+'</button></div>';
 const dots='<div class="s" style="margin:4px 0 14px">Step '+(wstep+1)+' of '+WSTEPS.length+' · '+WSTEPS[wstep]+'</div>';
 let h='<div class="in set"><h1 style="margin:14px 0 2px">Set up Strivo</h1>'+dots;
 if(wstep==0)h+='<div class="row" style="display:block"><div class="t" style="white-space:normal;font-size:17px">Strivo remembers everything you watch, across every app, by itself.</div><p class="s" style="white-space:normal">It listens to your streaming boxes on your home network, builds your history and queue, and finds what to watch next. Everything stays on this computer. There is no Strivo account and no Strivo cloud.</p><p class="s" style="white-space:normal">This takes about 3 minutes: find your boxes, add a free TMDB key for posters, pick your services, and name your TVs.</p></div>'+nav(false,true,"Let's go ›");
 else if(wstep==1)h+='<div class="s" style="white-space:normal">Apple TV, Google TV / Android TV and Fire TV track what you watch. Plex and Jellyfin servers report exactly what plays on any screen. Roku support is experimental.</div><h3>Added</h3><div id="wdev">'+devRows([])+'</div><h3>Add</h3><div id="waddb"></div>'+nav(true,true,(S.devices||[]).length?"Next ›":"Skip for now ›");
 else if(wstep==2)h+=(S.tmdb_key_set?'<div class="row"><div class="t" style="color:var(--ok)">✓ TMDB key saved</div><div class="s">You can change it later in Settings.</div></div>':'<div class="row" style="display:block">'+tmdbForm()+'</div>')+nav(true,true,S.tmdb_key_set?"Next ›":"Skip for now ›");
 else if(wstep==3)h+='<div class="row"><div class="ln"><div>Country</div><select id="wct">'+COUNTRIES.map(c=>'<option value="'+c[0]+'"'+(c[0]==S.country?' selected':'')+'>'+esc(c[1])+'</option>').join("")+'</select></div></div><h3>Services you pay for</h3><div class="row"><div class="svc">'+S.all_services.map(n=>'<button class="btn'+(S.services.includes(n)?" on":"")+'" data-wsv="'+esc(n)+'">'+esc(n)+'</button>').join("")+'</div><div class="note">Picks only show what is included with these.</div></div>'+nav(true,true);
 else{const tv=(S.devices||[]).filter(d=>["appletv","android","roku"].includes(d.kind));
  h+=(tv.length?'<div class="s" style="white-space:normal;margin-bottom:8px">Give each TV the name you use at home, and pick the one Play on TV uses first.</div>'+tv.map(d=>'<div class="row"><input class="wq" data-wn="'+esc(d.id)+'" value="'+esc(d.name)+'"><label class="s" style="display:flex;gap:6px;align-items:center;margin-left:8px;white-space:nowrap"><input type="radio" name="wdef" value="'+esc(d.id)+'"'+(S.default_tv==d.id?' checked':'')+'> Default</label></div>').join(""):'<div class="row"><div class="s" style="white-space:normal">No TVs added yet. You can add them any time in More › Devices.</div></div>')+nav(true,true,"Finish ✓")}
 w.innerHTML=h+'</div>';
 const go2=n=>{wstep=n;wizard();w.scrollTop=0};
 if($("#wb"))$("#wb").onclick=()=>go2(wstep-1);
 $("#wn").onclick=async()=>{if(wstep==4){for(const i of w.querySelectorAll("[data-wn]"))if(i.value.trim())await jpost("/api/setup/device",{id:i.dataset.wn,name:i.value.trim()});const r=w.querySelector('input[name=wdef]:checked');if(r)await jpost("/api/setup/prefs",{default_tv:r.value});await jpost("/api/setup/done");w.remove();ST=null;load();toast("You're set. Now just watch TV.");return}go2(wstep+1)};
 if(wstep==1){const hl=async()=>{try{return (await (await fetch("/api/health")).json()).devices}catch(e){return []}};hl().then(h=>{if($("#wdev")){$("#wdev").innerHTML=devRows(h);bindDevRows($("#wdev"),redraw)}});const redraw=async()=>{await suLoad();$("#wdev").innerHTML=devRows(await hl());bindDevRows($("#wdev"),redraw);const b=$("#wn");if(b)b.textContent=(SU.devices||[]).length?"Next ›":"Skip for now ›"};bindDevRows($("#wdev"),redraw);addBox($("#waddb"),redraw)}
 if(wstep==2&&!S.tmdb_key_set)bindTmdb(w,()=>go2(3));
 if(wstep==3){$("#wct").onchange=async e=>{SU=await jpost("/api/setup/prefs",{country:e.target.value})};
  w.querySelectorAll("[data-wsv]").forEach(b=>b.onclick=async()=>{const n=b.dataset.wsv,on=SU.services.includes(n);SU=await jpost("/api/setup/prefs",{my_services:on?SU.services.filter(x=>x!=n):SU.services.concat([n])});b.classList.toggle("on",!on)})}}
async function boot(){await suLoad();if(SU&&!SU.setup_done){wstep=0;wizard()}load()}

fixBottom();head();nav();boot();if("serviceWorker" in navigator&&window.isSecureContext)navigator.serviceWorker.register("/sw.js").catch(()=>{});setInterval(load,30000);
</script></body></html>
